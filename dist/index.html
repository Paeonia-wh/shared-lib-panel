<!-- 模拟「你正在干活的桌面」 -->
<div class="desk" id="desk">
  <div class="fake-window">
    <div class="fw-bar"><i></i><i></i><i></i><span>app/page.tsx</span></div>
    <div class="fw-code">
      <div class="fw-row"><b>1</b><span class="k">export default function</span> <span class="f">Page</span>() {</div>
      <div class="fw-row"><b>2</b>  <span class="k">return</span> &lt;<span class="f">main</span> className=<span class="s">"grid"</span>&gt;</div>
      <div class="fw-row"><b>3</b>    &lt;<span class="f">h1</span>&gt;浙有好市&lt;/<span class="f">h1</span>&gt;</div>
      <div class="fw-row"><b>4</b>  &lt;/<span class="f">main</span>&gt;</div>
      <div class="fw-row"><b>5</b>}</div>
      <div class="fw-row dim"><b>6</b></div>
      <div class="fw-row dim"><b>7</b><span class="k">// </span>npm run build</div>
    </div>
  </div>
  <div class="fake-window w2">
    <div class="fw-bar"><i></i><i></i><i></i><span>今日任务</span></div>
    <div class="fw-list">
      <div class="fw-item">小程序端：歌曲列表分页<em>14:20</em></div>
      <div class="fw-item">后端：报名接口联调<em>13:05</em></div>
      <div class="fw-item">数据库：评分表索引优化<em>11:48</em></div>
      <div class="fw-item">小程序端：评委打分页<em>昨天</em></div>
    </div>
  </div>
</div>

<!-- 悬浮球（bloub 引擎）
     窗口 = 球本身 = --ball（72px）。画布就这么大，装饰超出就被裁 —— 见 style.css
     里「为什么没有留白」那段：orbit / play / notify / burst 四个动作的装饰
     要 1.15~1.4 倍球半径，装不下，所以没放进随机播放。 -->
<div class="ball" id="ball" role="button" tabindex="0" aria-label="共享项目库">
  <svg id="bot" viewBox="-158 -158 316 316" role="img" aria-hidden="true"></svg>
</div>

<!-- 面板 -->
<section class="panel" id="panel" aria-hidden="true">
  <header class="p-head">
    <div class="p-title">共享项目库<span class="p-build" id="buildStamp"></span></div>
    <div class="p-actions">
      <button class="btn btn-ghost btn-sync" id="syncBtn" title="和共享库同步（重新读一遍并核对）"><svg class="ic"><use href="#i-sync"/></svg></button>
      <!-- 开新项目（2026-09-16 加）：原来**没有任何地方**告诉新会话怎么从零建项目 ——
           四个复制块全是"项目卡上的按钮"，而新项目在面板上还没有卡，一个都点不到。
           放在这一排（右上角）而不是挂项目卡上，正是因为它不属于任何已有项目。 -->
      <!-- 开始一个新东西（2026-09-16 加；同日重写内容）：
           原来**没有任何地方**告诉新会话怎么从零开始 —— 四个复制块全是"项目卡上的按钮"，
           而新东西在面板上还没有卡，一个都点不到。
           ⚠ 文案是「开始一个新东西」而不是「开新项目」——因为按真实流程，
             **第一步是跟用户讨论（走 grill-me skill），不是建项目**：
             用户可能只有一个想法、或者一份 PPT，没有目录也没有任务。
             按钮叫"开新项目"会误导会话直接去 bootstrap。 -->
      <button class="btn btn-ghost btn-newproj" id="newProjBtn" title="复制「开始一个新东西」的做法（先讨论清楚，再建项目）"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="btn btn-ghost btn-req" id="reqBtn" title="复制「怎么记录进共享库」的说明"><svg class="ic"><use href="#i-tasks"/></svg></button>
      <button class="btn btn-pin" id="pinBtn" title="钉住面板"><svg class="ic"><use href="#i-pin"/></svg></button>
      <button class="btn btn-ghost" id="closeBtn" title="收起（Esc）"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <div class="p-stats" id="stats"></div>

  <div class="swatches" id="swatches"></div>

  <div class="p-list" id="list"></div>
</section>

<!-- BUILD-STAMP: 构建时由 npm run front 自动写入，用来确认面板跑的是哪一版 -->
<meta name="panel-build" content="09-16 22:16">
<script src="./bundle.js"></script>
</body>
</html>
